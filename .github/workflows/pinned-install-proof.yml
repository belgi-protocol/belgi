name: Pinned Install Proof

on:
  workflow_call:
    inputs:
      belgi_ref:
        required: false
        type: string
      belgi_repo_url:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      belgi_ref:
        description: "Pinned BELGI git ref (full 40-hex commit SHA)"
        required: false
        type: string
      belgi_repo_url:
        description: "BELGI git repository URL (default: official repo)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  belgi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tier: tier-1
            bundle_check: true
          - os: ubuntu-latest
            tier: tier-0
            bundle_check: false
          - os: macos-latest
            tier: tier-0
            bundle_check: false
          - os: windows-latest
            tier: tier-0
            bundle_check: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      TZ: "UTC"

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 1

      - uses: ./.github/actions/belgi-python-setup
        with:
          python-version: "3.11"

      - name: Resolve BELGI workflow inputs (fail-closed)
        id: resolve_inputs
        shell: bash
        env:
          BELGI_REF_INPUT: ${{ inputs.belgi_ref }}
          BELGI_REPO_URL_INPUT: ${{ inputs.belgi_repo_url }}
          BELGI_VARS_JSON: ${{ toJson(vars) }}
        run: |
          set -euo pipefail
          python .github/scripts/resolve_belgi_workflow_inputs.py

      - name: Validate immutable BELGI_REF pin (fail-closed)
        shell: python
        run: |
          import os
          import subprocess
          import sys

          cmd = [
              sys.executable,
              ".github/scripts/validate_belgi_ref_pin.py",
              "--ref",
              os.environ.get("BELGI_REF", ""),
          ]
          raise SystemExit(subprocess.call(cmd))

      - name: Install pinned BELGI CLI
        shell: python
        run: |
          import os
          import subprocess
          import sys

          ref = os.environ["BELGI_REF"]
          repo_url = os.environ["BELGI_REPO_URL"]
          install_target = f"git+{repo_url}@{ref}"
          cmds = [
              [sys.executable, "-m", "pip", "install", "--upgrade", "pip"],
              [sys.executable, "-m", "pip", "install", install_target],
              ["belgi", "about"],
          ]
          for cmd in cmds:
              cp = subprocess.run(cmd, check=False, shell=False)
              if cp.returncode != 0:
                  raise SystemExit(cp.returncode)

      # Local parity command set:
      #   belgi init --repo .
      #   belgi run --repo . --tier <tier>
      #   belgi verify --repo .
      #   belgi bundle check --in .belgi/runs/<run_key>/<attempt_id>/repo/out --demo --verbose
      - name: BELGI smoke (${{ matrix.tier }})
        id: smoke
        shell: python
        env:
          RUN_TIER: ${{ matrix.tier }}
          BUNDLE_CHECK: ${{ matrix.bundle_check && 'true' || 'false' }}
        run: |
          import os
          import subprocess
          import sys

          cmd = [
              sys.executable,
              ".github/scripts/run_belgi_smoke.py",
              "--repo",
              ".",
              "--tier",
              os.environ["RUN_TIER"],
          ]
          if os.environ.get("BUNDLE_CHECK", "false").lower() == "true":
              cmd.append("--bundle-check")
          cp = subprocess.run(cmd, check=False, shell=False)
          raise SystemExit(cp.returncode)

      - name: Validate artifact paths
        shell: python
        env:
          ATTEMPT_DIR: ${{ steps.smoke.outputs.attempt_dir }}
          RUN_LOG: ${{ steps.smoke.outputs.run_log }}
        run: |
          import os
          import pathlib
          import sys

          attempt_dir = pathlib.Path(os.environ["ATTEMPT_DIR"])
          run_log = pathlib.Path(os.environ["RUN_LOG"])
          if not run_log.is_file():
              print(f"missing run log: {run_log}", file=sys.stderr)
              raise SystemExit(1)
          if not attempt_dir.is_dir():
              print(f"missing attempt dir: {attempt_dir}", file=sys.stderr)
              raise SystemExit(1)
          if not (attempt_dir / "run.summary.json").is_file():
              print(f"missing run.summary.json under {attempt_dir}", file=sys.stderr)
              raise SystemExit(1)
          if not (attempt_dir / "repo" / "out").is_dir():
              print(f"missing repo/out under {attempt_dir}", file=sys.stderr)
              raise SystemExit(1)
          (attempt_dir / "logs").mkdir(parents=True, exist_ok=True)

      - name: Detect ACT context
        id: act_context
        shell: bash
        run: |
          set -euo pipefail
          actor="${GITHUB_ACTOR:-}"
          act_raw="${ACT:-}"
          force_raw="${BELGI_FORCE_ACT:-}"
          act_lc="$(printf '%s' "$act_raw" | tr '[:upper:]' '[:lower:]')"
          force_lc="$(printf '%s' "$force_raw" | tr '[:upper:]' '[:lower:]')"
          force_act=0
          direct_act=0
          if [ "$act_lc" = "1" ] || [ "$act_lc" = "true" ]; then
            direct_act=1
          fi
          if [ "$force_lc" = "1" ] || [ "$force_lc" = "true" ]; then
            force_act=1
          fi

          is_act=0
          if [ "$actor" = "nektos/act" ] || [ "$direct_act" -eq 1 ] || [ "$force_act" -eq 1 ]; then
            is_act=1
          fi
          echo "is_act=$is_act" >> "$GITHUB_OUTPUT"

      - name: Upload BELGI run artifact
        if: ${{ steps.act_context.outputs.is_act != '1' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pinned-install-${{ steps.resolve_inputs.outputs.belgi_ref_short }}-${{ matrix.os }}-${{ matrix.tier }}
          if-no-files-found: error
          path: |
            ${{ steps.smoke.outputs.run_log }}
            ${{ steps.smoke.outputs.attempt_dir }}/run.summary.json
            ${{ steps.smoke.outputs.attempt_dir }}/repo/out/**
            ${{ steps.smoke.outputs.attempt_dir }}/logs/**

  pinned-install-proof-gate:
    name: pinned-install-proof-gate
    if: ${{ always() }}
    needs:
      - belgi
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate pinned install proof gate
        shell: bash
        env:
          BELGI_RESULT: ${{ needs.belgi.result }}
        run: |
          set -euo pipefail
          echo "belgi=${BELGI_RESULT}"
          if [ "${BELGI_RESULT}" != "success" ]; then
            echo "NO-GO: pinned install proof concluded ${BELGI_RESULT}" >&2
            exit 1
          fi
