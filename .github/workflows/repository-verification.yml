name: Repository Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

concurrency:
  group: repository-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      TZ: "UTC"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - uses: ./.github/actions/belgi-python-setup
        with:
          python-version: "3.11"
          editable: "true"
          install-pytest: "true"

      - name: External action SHA pin guard
        run: python .github/scripts/check_external_action_pins.py --repo .

      - name: Byte Guard (normalize / CRLF drift check)
        run: python -m tools.normalize --repo . --check --tracked-only

      - name: Protocol Pack Drift Guard
        run: python -m tools.check_drift

      - name: CODEOWNERS dead-path guard
        run: python -m tools.check_codeowners --repo . --codeowners .github/CODEOWNERS

      - name: Syntax check
        run: python -m compileall -q belgi chain tools wrapper

      - name: Ruff lint
        run: |
          python -m pip install "ruff==0.4.8"
          python -m ruff check belgi chain tools wrapper tests scripts .github/scripts

      - name: Unit tests
        run: pytest -q

      - name: Verify builtin protocol pack (repo)
        run: python -m belgi.cli pack verify --in belgi/_protocol_packs/v1

      - name: Consistency sweep
        run: |
          set -euo pipefail
          mkdir -p policy
          python -m tools.sweep consistency --repo . 2>&1 | tee policy/consistency_sweep.log

      - name: Consistency sweep summary
        if: always()
        run: |
          if [ -f "policy/consistency_sweep.summary.md" ]; then
            cat policy/consistency_sweep.summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ \`policy/consistency_sweep.summary.md\` not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect ACT context
        id: act_context
        shell: bash
        run: |
          set -euo pipefail
          actor="${GITHUB_ACTOR:-}"
          act_raw="${ACT:-}"
          force_raw="${BELGI_FORCE_ACT:-}"
          act_lc="$(printf '%s' "$act_raw" | tr '[:upper:]' '[:lower:]')"
          force_lc="$(printf '%s' "$force_raw" | tr '[:upper:]' '[:lower:]')"
          force_act=0
          direct_act=0
          if [ "$act_lc" = "1" ] || [ "$act_lc" = "true" ]; then
            direct_act=1
          fi
          if [ "$force_lc" = "1" ] || [ "$force_lc" = "true" ]; then
            force_act=1
          fi

          is_act=0
          if [ "$actor" = "nektos/act" ] || [ "$direct_act" -eq 1 ] || [ "$force_act" -eq 1 ]; then
            is_act=1
          fi
          echo "is_act=$is_act" >> "$GITHUB_OUTPUT"

      - name: Upload consistency sweep artifacts
        if: ${{ always() && steps.act_context.outputs.is_act != '1' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: consistency-sweep
          if-no-files-found: error
          path: |
            policy/consistency_sweep.json
            policy/consistency_sweep.log
            policy/consistency_sweep.summary.md

      - name: Verify no tracked file changes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Tracked files changed during verifier run:" >&2
            git status --porcelain --untracked-files=no >&2
            exit 1
          fi

  wheel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    env:
      PYTHONUTF8: "1"
      TZ: "UTC"

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - uses: ./.github/actions/belgi-python-setup
        with:
          python-version: "3.11"

      - name: Resolve wheel artifact name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact_name=repository-wheel-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build canonical wheel
        run: |
          set -euo pipefail
          mkdir -p wheel_proof
          python -m pip install --upgrade build
          python -m build --wheel 2>&1 | tee wheel_proof/build.log

      - name: Assert wheel publish boundary
        run: |
          set -euo pipefail
          WHEEL="$(ls -1 dist/belgi-*.whl | sort | tail -n1)"
          python -m tools.wheel_boundary --wheel "$WHEEL" 2>&1 | tee wheel_proof/boundary.log

      - name: Upload canonical wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          if-no-files-found: error
          path: dist/*.whl

  wheel-smoke:
    needs: wheel-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    env:
      PYTHONUTF8: "1"
      TZ: "UTC"

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - uses: ./.github/actions/belgi-python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download canonical wheel artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.wheel-build.outputs.artifact_name }}
          path: dist

      - name: Setup smoke venv (outside repo)
        run: echo "SMOKE_VENV=${RUNNER_TEMP}/belgi-smoke-venv-${{ matrix.python-version }}" >> "$GITHUB_ENV"

      - name: Install wheel in smoke venv
        run: |
          python -m venv "${SMOKE_VENV}"
          "${SMOKE_VENV}/bin/pip" install --upgrade pip
          "${SMOKE_VENV}/bin/pip" install dist/*.whl

      - name: Verify builtin pack (no shadowing)
        env:
          PYTHONPATH: ""
        run: |
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"
          "${SMOKE_VENV}/bin/python" -m belgi.ci_smoke_verify

      - name: Test belgi CLI entrypoint
        run: |
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"
          "${SMOKE_VENV}/bin/belgi" about
          "${SMOKE_VENV}/bin/belgi" pack verify --builtin

      - name: Run packaging smoke tests
        env:
          BELGI_ENFORCE_NO_SHADOWING: "1"
          PYTHONPATH: ""
        run: |
          "${SMOKE_VENV}/bin/pip" install pytest
          TMPDIR="$(mktemp -d)"
          cp tests/test_packaging_smoke.py "$TMPDIR/"
          cd "$TMPDIR"
          "${SMOKE_VENV}/bin/python" -m pytest -v -m "not repo_local" test_packaging_smoke.py

  repository-verification-gate:
    name: repository-verification-gate
    if: ${{ always() }}
    needs:
      - health
      - wheel-build
      - wheel-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate repository verification gate
        shell: bash
        env:
          HEALTH_RESULT: ${{ needs.health.result }}
          WHEEL_BUILD_RESULT: ${{ needs.wheel-build.result }}
          WHEEL_SMOKE_RESULT: ${{ needs.wheel-smoke.result }}
        run: |
          set -euo pipefail
          for item in \
            "health:${HEALTH_RESULT}" \
            "wheel-build:${WHEEL_BUILD_RESULT}" \
            "wheel-smoke:${WHEEL_SMOKE_RESULT}"
          do
            job_name="${item%%:*}"
            job_result="${item#*:}"
            echo "${job_name}=${job_result}"
            if [ "${job_result}" != "success" ]; then
              echo "NO-GO: ${job_name} concluded ${job_result}" >&2
              exit 1
            fi
          done
