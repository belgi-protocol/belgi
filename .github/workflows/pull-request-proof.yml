name: Pull Request Proof

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pull-request-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'proof:full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_sha: ${{ steps.sha.outputs.pr_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/belgi-python-setup
        with:
          python-version: "3.11"

      - name: Resolve PR head SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          echo "pr_sha=${PR_SHA}" >> "$GITHUB_OUTPUT"
          mkdir -p proof_preflight
          echo "${PR_SHA}" > proof_preflight/pr_sha.txt

      - name: Validate immutable SHA pin (NIT-5)
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate_belgi_ref_pin.py --ref "${{ steps.sha.outputs.pr_sha }}" \
            2>&1 | tee proof_preflight/pin_check.log

      - name: Validate floating refs are rejected (NIT-5 negative cases)
        shell: bash
        run: |
          set -euo pipefail
          for bad_ref in main HEAD; do
            if python .github/scripts/validate_belgi_ref_pin.py --ref "${bad_ref}" \
              >"proof_preflight/pin_check_negative_${bad_ref}.log" 2>&1; then
              echo "NO-GO: floating ref was accepted: ${bad_ref}" \
                | tee -a "proof_preflight/pin_check_negative_${bad_ref}.log"
              exit 1
            fi
            echo "PASS: floating ref rejected as expected: ${bad_ref}" \
              | tee -a "proof_preflight/pin_check_negative_${bad_ref}.log"
          done

      - name: Detect ACT context
        id: act_context
        shell: bash
        run: |
          set -euo pipefail
          actor="${GITHUB_ACTOR:-}"
          force_raw="${BELGI_FORCE_ACT:-}"
          force_lc="$(printf '%s' "$force_raw" | tr '[:upper:]' '[:lower:]')"
          force_act=0
          if [ "$force_lc" = "1" ] || [ "$force_lc" = "true" ]; then
            force_act=1
          fi

          is_act=0
          if [ "$actor" = "nektos/act" ] || [ "$force_act" -eq 1 ]; then
            is_act=1
          fi
          echo "is_act=$is_act" >> "$GITHUB_OUTPUT"

      - name: Upload preflight logs
        if: ${{ always() && steps.act_context.outputs.is_act != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-preflight-${{ steps.sha.outputs.pr_sha }}
          if-no-files-found: error
          path: proof_preflight/

  smoke:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'proof:full') }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.pr_sha }}
          fetch-depth: 1

      - uses: ./.github/actions/belgi-python-setup
        with:
          python-version: "3.11"
          editable: "true"

      - name: Tier-0 smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof_smoke
          python .github/scripts/run_belgi_smoke.py --repo . --tier tier-0 \
            2>&1 | tee "proof_smoke/tier0-${{ matrix.os }}.log"

      - name: Tier-1 smoke (ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/run_belgi_smoke.py --repo . --tier tier-1 \
            2>&1 | tee "proof_smoke/tier1-${{ matrix.os }}.log"

      - name: Detect ACT context
        id: act_context
        shell: bash
        run: |
          set -euo pipefail
          actor="${GITHUB_ACTOR:-}"
          force_raw="${BELGI_FORCE_ACT:-}"
          force_lc="$(printf '%s' "$force_raw" | tr '[:upper:]' '[:lower:]')"
          force_act=0
          if [ "$force_lc" = "1" ] || [ "$force_lc" = "true" ]; then
            force_act=1
          fi

          is_act=0
          if [ "$actor" = "nektos/act" ] || [ "$force_act" -eq 1 ]; then
            is_act=1
          fi
          echo "is_act=$is_act" >> "$GITHUB_OUTPUT"

      - name: Upload smoke artifacts
        if: ${{ always() && steps.act_context.outputs.is_act != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-smoke-${{ matrix.os }}-${{ needs.preflight.outputs.pr_sha }}
          if-no-files-found: warn
          path: |
            proof_smoke/
            .belgi/run.stdout.log
            .belgi/runs/**/run.summary.json
            .belgi/runs/**/repo/out/**

  wheel-smoke:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'proof:full') }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      TZ: "UTC"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.pr_sha }}
          fetch-depth: 1

      - uses: ./.github/actions/belgi-python-setup
        with:
          python-version: "3.11"

      - name: Build wheel from PR SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof_wheel
          python -m pip install --upgrade build
          python -m build --wheel 2>&1 | tee proof_wheel/build.log

      - name: Fresh venv install + CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          VENV="${RUNNER_TEMP}/proof-wheel-venv"
          python -m venv "${VENV}"
          "${VENV}/bin/pip" install --upgrade pip
          "${VENV}/bin/pip" install dist/*.whl 2>&1 | tee proof_wheel/install.log
          "${VENV}/bin/belgi" --help > proof_wheel/belgi-help.log
          "${VENV}/bin/belgi" pack verify --builtin > proof_wheel/builtin-verify.log 2>&1

      - name: Detect ACT context
        id: act_context
        shell: bash
        run: |
          set -euo pipefail
          actor="${GITHUB_ACTOR:-}"
          force_raw="${BELGI_FORCE_ACT:-}"
          force_lc="$(printf '%s' "$force_raw" | tr '[:upper:]' '[:lower:]')"
          force_act=0
          if [ "$force_lc" = "1" ] || [ "$force_lc" = "true" ]; then
            force_act=1
          fi

          is_act=0
          if [ "$actor" = "nektos/act" ] || [ "$force_act" -eq 1 ]; then
            is_act=1
          fi
          echo "is_act=$is_act" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        if: ${{ always() && steps.act_context.outputs.is_act != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-wheel-${{ needs.preflight.outputs.pr_sha }}
          if-no-files-found: error
          path: dist/*.whl

      - name: Upload wheel logs
        if: ${{ always() && steps.act_context.outputs.is_act != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-wheel-logs-${{ needs.preflight.outputs.pr_sha }}
          if-no-files-found: error
          path: proof_wheel/

  pull-request-proof-gate:
    name: pull-request-proof-gate
    if: ${{ always() }}
    needs:
      - preflight
      - smoke
      - wheel-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate pull request proof gate
        shell: bash
        env:
          PROOF_FULL_LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, 'proof:full') && 'true' || 'false' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          WHEEL_RESULT: ${{ needs.wheel-smoke.result }}
        run: |
          set -euo pipefail
          echo "proof:full=${PROOF_FULL_LABEL_PRESENT}"
          if [ "${PROOF_FULL_LABEL_PRESENT}" != "true" ]; then
            echo "NO-GO: add label proof:full so exact PR-head proof runs and this gate can pass" >&2
            exit 1
          fi

          for item in \
            "preflight:${PREFLIGHT_RESULT}" \
            "smoke:${SMOKE_RESULT}" \
            "wheel-smoke:${WHEEL_RESULT}"
          do
            job_name="${item%%:*}"
            job_result="${item#*:}"
            echo "${job_name}=${job_result}"
            if [ "${job_result}" != "success" ]; then
              echo "NO-GO: ${job_name} concluded ${job_result}" >&2
              exit 1
            fi
          done
