[pytest]
# The suite is path-owned and lane-modular under tests/.
# Lane identity is enforced by tests/meta/test_lane_contracts.py, not by a second marker taxonomy.
testpaths =
    tests
addopts = --strict-markers
markers =
    repo_local: requires repo-local modules (e.g., chain) and must not run in installed-wheel smoke
    serial: explicit justified serial exception lane under tests/serial only
